[package]
name = "lomah"
version = "0.1.0"
description = "LOMAH Range System"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri puts the app in a library so the same code can back a desktop binary
# and a mobile entry point. main.rs is a three-line shim over run().
name = "lomah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SO_REUSEADDR on the discovery socket. std::net::UdpSocket cannot set it, and
# without it a second instance cannot bind UDP 5002 to find out that the first
# one is already the admin — the election fails exactly when it is needed.
socket2 = "0.6"
# Enumerating this machine's own IPv4 addresses, so we can tell our own
# broadcast beacon apart from a rival admin's.
if-addrs = "0.14"
# The per-install JWT secret. Only randomness is needed, not a crypto suite.
getrandom = "0.3"
# Turning Tauri's verbatim paths into ones Node can actually open.
dunce = "1"

[profile.release]
# This ships to tablets over a sneakernet, so the binary's size is worth more
# than its last few percent of speed — the Rust side only supervises a process
# and listens for a beacon, none of which is hot.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
